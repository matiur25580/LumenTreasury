services:
  mongodb:
    image: mongo:7
    container_name: lumentreasury-mongodb
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [lumentreasury-mongo:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: lumentreasury-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [lumentreasury-redis:/data]
volumes:
  lumentreasury-mongo:
  lumentreasury-redis:
